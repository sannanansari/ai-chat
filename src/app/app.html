<div class="container">

  <div class="header">
    <span class="domain">ai.sannan.app</span>
    <span class="tag">Phase 1 · Week 5</span>
  </div>

  <div class="chat-box">
    @if (answer() || loading()) {
      <div class="label">Answer</div>
      <div class="answer-text">
        <markdown [data]="answer()"></markdown>
        <span class="cursor" [class.visible]="loading()">█</span>
      </div>
    }

@if (error()) {
  <div class="error">{{ error() }}</div>
}
  </div>

  <div class="input-row">
    <input
      [(ngModel)]="question"
      (keydown.enter)="ask()"
      placeholder="Ask anything..."
      [disabled]="loading()"
    />
    <button (click)="ask()" [disabled]="loading()">
      {{ loading() ? '...' : 'Ask' }}
    </button>
  </div>

</div>
